name: Release

# A tag v<version> on main builds and tests the package, then STAGES it on npm (`npm stage publish`). Nothing is public
# until a maintainer approves the staged version with 2FA, on npmjs.com or with `npm stage approve`. Run by hand
# (workflow_dispatch) it only builds and tests: a rehearsal that stages nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Installs dependencies and runs their code (the build, the tests). It holds no id-token permission, so nothing in it
  # can ask npm for a publishing token.
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the check below needs main's history
          persist-credentials: false
      - name: The tag is this version, and the commit is on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match the version in package.json ($VERSION)"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Takumi Guard, as in ci.yml (https://shisho.dev/docs/ja/t/guard/quickstart/npm/).
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      - name: Check that the guard is in the path
        run: node scripts/verify-guard.mjs
      - name: Check where the lockfile's packages come from
        run: node scripts/check-lockfile.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run smoke
      - name: Pack
        id: pack
        run: |
          TARBALL=$(npm pack --silent | tail -n 1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # Holds the id-token permission, so it runs no repository code and installs nothing but npm itself: it takes the
  # tarball that was built and tested, checks it is that one, and stages it. The trusted publisher on npmjs.com is
  # set to this workflow, the "npm" environment, and `npm stage publish` only (no direct publish).
  stage:
    name: Stage on npm
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: The tarball is the one that was built and tested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: echo "$EXPECTED  package/$TARBALL" | sha256sum --check -
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Staging needs npm 11.15 or later, newer than the one that comes with Node 24. It comes through the guard too.
      - name: Install a newer npm
        env:
          NPM_CONFIG_REGISTRY: https://npm.flatt.tech/
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.19.1
      # Takumi Guard is read-only, so the registry is named: this goes to npm itself, with provenance, using the
      # short-lived OIDC credential of the trusted publisher (there is no npm token in this repository).
      - name: Stage
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=next ;; esac # a pre-release must not become "latest"
          npm stage publish "package/$TARBALL" --tag "$TAG" --provenance
