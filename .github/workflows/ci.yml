name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, types and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Takumi Guard, set up as its npm quickstart says (https://shisho.dev/docs/ja/t/guard/quickstart/npm/): from here
      # on every install goes through npm.flatt.tech, which refuses known malicious packages. Anonymous mode (no
      # bot-id) blocks and needs no id-token permission; a bot-id would add download tracking and notices.
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      - name: Check that the guard is in the path
        run: node scripts/verify-guard.mjs
      # The guard sees a package only if it is fetched from the npm registry or from the guard itself, not from a git or tarball URL.
      - name: Check where the lockfile's packages come from
        run: node scripts/check-lockfile.mjs
      - name: Install (the lockfile pins every version; no install script runs)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Unit tests (Bun)
        run: bun test
      - name: Types
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Smoke test of the build
        run: npm run smoke
      - name: What a publish would contain
        run: npm pack --dry-run

  # The unit tests run on Bun and production runs on Node, so the build itself is run on every Node it supports.
  node:
    name: Build on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      - name: Check that the guard is in the path
        run: node scripts/verify-guard.mjs
      - name: Check where the lockfile's packages come from
        run: node scripts/check-lockfile.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run smoke
